// ───────────────────────── Reports ─────────────────────────
const PRESETS = { today: 'Today', week: 'This week', month: 'This month', lastmonth: 'Last month', year: 'This year' };
function period(key) {
  const t = isoDate();
  if (key === 'today') return [t, t];
  if (key === 'week') return [weekStart(t), addDays(weekStart(t), 6)];
  if (key === 'lastmonth') { const s = monthStart(addDays(monthStart(t), -1)); return [s, monthEnd(s)]; }
  if (key === 'year') return [t.slice(0, 4) + '-01-01', t.slice(0, 4) + '-12-31'];
  return [monthStart(t), monthEnd(t)];
}
function Reports({ s }) {
  const [key, setKey] = useState('month');
  const [custom, setCustom] = useState(null);
  const [from, to] = custom || period(key);
  const inRange = (iso) => { const d = isoDate(new Date(iso)); return d >= from && d <= to; };
  const invs = s.invoices.filter((i) => i.status !== 'Void' && inRange(i.createdAt));
  const pays = s.invoices.filter((i) => i.status !== 'Void').flatMap((i) => (i.payments || []).filter((p) => inRange(p.at)));
  const exps = s.expenses.filter((e) => e.date >= from && e.date <= to);
  const sum = (xs) => xs.reduce((a, b) => a + b, 0);
  const sales = sum(invs.map((i) => i.total)), tax = sum(invs.map((i) => i.tax)), net = sales - tax, spent = sum(exps.map((e) => e.amount));
  const days = Math.round((parseDate(to) - parseDate(from)) / 864e5) + 1, byMonth = days > 62;
  const buckets = new Map();
  if (byMonth) { for (let d = from; d <= to; d = addDays(d, 28)) buckets.set(d.slice(0, 7), 0); buckets.set(to.slice(0, 7), buckets.get(to.slice(0, 7)) || 0); }
  else for (let i = 0; i < days; i++) buckets.set(addDays(from, i), 0);
  invs.forEach((i) => { const k = byMonth ? isoDate(new Date(i.createdAt)).slice(0, 7) : isoDate(new Date(i.createdAt)); buckets.set(k, (buckets.get(k) || 0) + i.total - i.tax); });
  const chart = [...buckets].map(([k, v]) => ({ label: byMonth ? fmtDate(k + '-01', { month: 'short' }) : fmtDate(k, { day: 'numeric', month: 'short' }), value: v }));
  const group = (xs, kf, vf) => { const m = new Map(); xs.forEach((x) => { const k = kf(x), v = vf(x), c = m.get(k) || { key: k, qty: 0, value: 0 }; m.set(k, { key: k, qty: c.qty + v.qty, value: c.value + v.value }); }); return [...m.values()].sort((a, b) => b.value - a.value); };
  const items = invs.flatMap((i) => i.items);
  const staffMap = Object.fromEntries(s.staff.map((x) => [x.id, x]));
  const perf = group(items.filter((i) => i.kind === 'service' && i.staffId), (i) => i.staffId, (i) => ({ qty: i.qty, value: i.total - i.tax }));
  const Break = ({ title, rows, unit }) => { const max = Math.max(1, ...rows.map((r) => r.value)); return html`<${Card} title=${title}>${rows.length ? rows.slice(0, 8).map((r) => html`<div style="margin-bottom:12px"><div class="sumrow"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.key}</span><span class="tab" style="white-space:nowrap"><span class="m">${r.qty} ${unit} · </span><b>${money0(r.value)}</b></span></div><div class="bar"><i style=${`width:${(r.value / max) * 100}%`}></i></div></div>`) : html`<span class="m">Nothing in this period.</span>`}<//>`; };
  const csv = (rows) => rows.map((r) => r.map((v) => { if (typeof v === 'number') return String(v); const x = /^[=+\-@]/.test(v) ? "'" + v : v; return /[",\n']/.test(x) ? `"${x.replace(/"/g, '""')}"` : x; }).join(',')).join('\r\n');
  const exportBills = () => download(`bills-${from}-to-${to}.csv`, '﻿' + csv([['Bill', 'Date', 'Client', 'Mobile', 'Status', 'Subtotal', 'Discount', 'Taxable value', 'CGST', 'SGST', 'Total', 'Paid', 'Due'],
    ...s.invoices.filter((i) => inRange(i.createdAt)).sort((a, b) => a.createdAt.localeCompare(b.createdAt)).map((i) => [i.number, isoDate(new Date(i.createdAt)), i.customerName, i.customerPhone, i.status, round2(i.subtotal), round2(i.discount), round2(i.subtotal - i.discount), round2(i.tax / 2), round2(i.tax / 2), round2(i.total), round2(i.paid), i.status === 'Void' ? 0 : round2(i.total - i.paid)])]), 'text/csv');
  const exportExp = () => download(`expenses-${from}-to-${to}.csv`, '﻿' + csv([['Date', 'Category', 'Description', 'Paid to', 'Method', 'Amount'], ...exps.sort((a, b) => a.date.localeCompare(b.date)).map((e) => [e.date, e.category, e.description, e.vendor || '', e.method, round2(e.amount)])]), 'text/csv');
  return html`
    <${Head} title="Reports" sub=${`${fmtDate(from)} to ${fmtDate(to)}`}><button class="btn sec" onClick=${exportBills}>Export bills (CSV)</button><button class="btn sec" onClick=${exportExp}>Export expenses (CSV)</button><//>
    <div class="row" style="margin-bottom:16px">${Object.entries(PRESETS).map(([k, t]) => html`<button class=${'btn sm ' + (!custom && key === k ? '' : 'sec')} onClick=${() => { setCustom(null); setKey(k); }}>${t}</button>`)}
      <input type="date" class="in" id="rp-from" style="width:auto;padding:5px 8px" aria-label="From" value=${from} onInput=${(e) => e.target.value && setCustom([e.target.value, to < e.target.value ? e.target.value : to])} /><span class="m">to</span><input type="date" class="in" id="rp-to" style="width:auto;padding:5px 8px" aria-label="To" value=${to} onInput=${(e) => e.target.value && setCustom([from > e.target.value ? e.target.value : from, e.target.value])} /></div>
    <div class="grid g4" style="margin-bottom:16px">
      <${Stat} k="Sales before GST" v=${money0(net)} n=${`${plural(invs.length, 'bill')} · ${money0(sum(invs.map((i) => i.discount)))} discounts`} />
      <${Stat} k="Expenses" v=${money0(spent)} n=${plural(exps.length, 'entry', 'entries')} />
      <${Stat} k="Profit" v=${money0(net - spent)} n="Sales before GST minus expenses" tone=${net - spent < 0 ? 'warn' : 'good'} />
      <${Stat} k="Collected" v=${money0(sum(pays.map((p) => p.amount)))} n=${`GST billed ${money0(tax)} · Dues ${money0(sum(invs.map((i) => i.total - i.paid)))}`} />
    </div>
    <${Card} title=${byMonth ? 'Sales by month (before GST)' : 'Sales by day (before GST)'} style="margin-bottom:16px">${invs.length ? html`<${BarChart} data=${chart} height=${200} />` : html`<${Empty} title="No sales in this period" />`}<//>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
      <${Card} title="Staff performance" pad=${false}>${perf.length ? html`<div class="tw"><table><thead><tr><th>Stylist</th><th class="r">Services</th><th class="r">Revenue</th><th class="r">Commission</th></tr></thead><tbody>${perf.map((r) => { const st = staffMap[r.key]; const rate = st?.commissionRate || 0; return html`<tr><td><b>${st?.name || 'Former staff'}</b></td><td class="r tab">${r.qty}</td><td class="r tab">${money0(r.value)}</td><td class="r tab">${money0((r.value * rate) / 100)}<div class="m">${rate}%</div></td></tr>`; })}</tbody></table></div>` : html`<${Empty} title="No services billed with a stylist" />`}<//>
      <${Break} title="Top services" rows=${group(items.filter((i) => i.kind === 'service'), (i) => i.name, (i) => ({ qty: i.qty, value: i.total - i.tax }))} unit="sold" />
      <${Break} title="Top products" rows=${group(items.filter((i) => i.kind === 'product'), (i) => i.name, (i) => ({ qty: i.qty, value: i.total - i.tax }))} unit="units" />
      <${Break} title="Payments by method" rows=${group(pays, (p) => p.method, (p) => ({ qty: 1, value: p.amount }))} unit="payments" />
      <${Break} title="Expenses by category" rows=${group(exps, (e) => e.category, (e) => ({ qty: 1, value: e.amount }))} unit="entries" />
    </div>`;
}

// ───────────────────────── Settings ─────────────────────────
function Setup({ s }) {
  const [f, setF] = useState(s.settings);
  // Show settings saved elsewhere, but never undo an edit in progress when the screen first opens.
  const seen = useRef(s.settings);
  useEffect(() => { if (seen.current !== s.settings) { seen.current = s.settings; setF(s.settings); } }, [s.settings]);
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  return html`
    <${Head} title="Settings" sub="Business details printed on bills, the GST rate, and opening hours." />
    <${Card} title="Business details" style="max-width:760px">
      <form class="form" onSubmit=${(e) => { e.preventDefault(); write(async () => {
          if (!f.name.trim()) throw new Problem('Enter the business name.');
          const gstin = (f.gstin || '').trim().toUpperCase();
          if (gstin && !/^[0-9]{2}[A-Z0-9]{13}$/.test(gstin)) throw new Problem('GSTIN should be 15 characters, like 06ABCDE1234F1Z5.');
          if (toMin(f.closeTime) <= toMin(f.openTime)) throw new Problem('Closing time must be after opening time.');
          const next = parseInt(f.nextInvoiceNo); if (!(next >= 1)) throw new Problem('Next bill number must be 1 or more.');
          const prefix = (f.invoicePrefix || '').trim();
          if (s.invoices.some((i) => i.number === prefix + next)) throw new Problem(`Bill ${prefix}${next} already exists. Choose a higher next number.`);
          await DB.doc('config/settings').set({ ...f, name: f.name.trim(), gstin, gstRate: Number(f.gstRate), invoicePrefix: prefix, nextInvoiceNo: next });
        }, 'Settings saved'); }}>
        <${F} label="Business name" full><input class="in" id="sg-name" value=${f.name} onInput=${set('name')} required /><//>
        <${F} label="Address" full hint="Printed on bills"><input class="in" id="sg-addr" value=${f.address} onInput=${set('address')} /><//>
        <${F} label="Phone"><input class="in" id="sg-phone" value=${f.phone} onInput=${set('phone')} /><//>
        <${F} label="Email"><input class="in" id="sg-email" value=${f.email} onInput=${set('email')} /><//>
        <${F} label="GST rate on bills" hint="Used on every bill that charges GST. Any bill can also be made without GST."><select class="in" id="sg-gst" value=${f.gstRate} onChange=${(e) => setF({ ...f, gstRate: Number(e.target.value) })}>${GST_RATES.map((r) => html`<option value=${r}>${r}%</option>`)}</select><//>
        <${F} label="GSTIN" hint="Leave blank if not registered"><input class="in" id="sg-gstin" style="text-transform:uppercase" value=${f.gstin} onInput=${set('gstin')} /><//>
        <${F} label="Opens at"><input class="in" id="sg-open" type="time" value=${f.openTime} onInput=${set('openTime')} /><//>
        <${F} label="Closes at"><input class="in" id="sg-close" type="time" value=${f.closeTime} onInput=${set('closeTime')} /><//>
        <${F} label="Bill number prefix"><input class="in" id="sg-prefix" value=${f.invoicePrefix} onInput=${set('invoicePrefix')} /><//>
        <${F} label="Next bill number" hint=${`Next bill will be ${f.invoicePrefix}${f.nextInvoiceNo}`}><input class="in" id="sg-next" type="number" min="1" value=${f.nextInvoiceNo} onInput=${set('nextInvoiceNo')} /><//>
        <${F} label="Message at the bottom of bills" full><input class="in" id="sg-foot" value=${f.footer} onInput=${set('footer')} /><//>
        <div class="actions full" style="margin:0"><button class="btn">Save settings</button></div>
      </form>
      <p class="m" style="margin-bottom:0">Who can change things is set from this page's Share menu: Contributors and Editors can make changes, Viewers can only look.</p>
    <//>`;
}

// ───────────────────────── App shell ─────────────────────────
const NAV = [['today', 'Today'], ['appointments', 'Appointments'], ['billing', 'Billing'], ['clients', 'Clients'], ['services', 'Services'], ['staff', 'Staff'], ['inventory', 'Inventory'], ['expenses', 'Expenses'], ['reports', 'Reports'], ['setup', 'Settings']];
const SCREENS = { today: Today, appointments: Appointments, billing: Billing, newbill: NewBill, clients: Clients, services: Services, staff: Staff, inventory: Inventory, expenses: Expenses, reports: Reports, setup: Setup };
const routeFromHash = () => { const h = location.hash.slice(1); return SCREENS[h] ? h : 'today'; };

function App() {
  const s = useStore();
  const [route, setRoute] = useState(routeFromHash());
  const [params, setParams] = useState(null);
  const [menu, setMenu] = useState(false);
  useEffect(() => { const f = () => setRoute(routeFromHash()); addEventListener('hashchange', f); return () => removeEventListener('hashchange', f); }, []);
  const go = (r, p = null) => { setParams(p ? { ...p, t: Date.now() } : null); setRoute(r); setMenu(false); try { history.replaceState(null, '', '#' + r); } catch (e) {} scrollTo(0, 0); };
  const Screen = SCREENS[route];
  const navKey = route === 'newbill' ? 'billing' : route;
  return html`<div class="app">
    <div class="topbar"><span style="font-family:var(--display);font-size:17px">${s.settings.name}</span><button class="btn sec sm" onClick=${() => setMenu(true)} aria-label="Open menu">Menu</button></div>
    ${menu && html`<div style="position:fixed;inset:0;z-index:39;background:rgb(0 0 0 / .3)" onClick=${() => setMenu(false)}></div>`}
    <aside class=${'side' + (menu ? ' open' : '')}>
      <div class="brand"><div class="eyebrow">Salon Studio</div><div class="salon">${s.settings.name}</div></div>
      <nav class="nav" aria-label="Screens">${NAV.map(([k, t]) => html`<a href=${'#' + k} aria-current=${navKey === k ? 'page' : undefined} onClick=${(e) => { e.preventDefault(); go(k); }}>${t}</a>`)}</nav>
      <div class="side-foot">${s.readOnly ? 'View only' : 'Changes save for everyone with access'}</div>
    </aside>
    <main><div class="wrap">
      ${s.offline && html`<div class="notice">${s.ready ? 'Can\'t reach the salon database right now. What you see may be out of date.' : 'Can\'t reach the salon database yet. Open this page in Claude while signed in to see your records.'}</div>`}
      ${s.readOnly && html`<div class="notice">You can view this page but not change it. Ask the owner for Contributor access to book and bill.</div>`}
      ${s.ready ? html`<${Screen} s=${s} go=${go} params=${params} key=${route} />` : html`<div class="empty"><b>Loading salon records…</b></div>`}
    </div></main>
    <${Toasts} />
  </div>`;
}

render(html`<${App} />`, document.getElementById('app'));
startData();
</script>
